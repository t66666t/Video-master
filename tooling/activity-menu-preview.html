<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>媒体库卡片 · 更多按钮</title>
  <style>
    :root {
      --bg: #121212;
      --card: #2c2c2c;
      --chip: #3d3d3d;
      --line: rgba(255, 255, 255, 0.22);
      --title: #fff;
      --meta: rgba(255, 255, 255, 0.54);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      background: #0b0b0b;
      color: #eee;
    }
    .page {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
    p.lead { margin: 0 0 20px; color: #b3b3b3; font-size: 14px; line-height: 1.5; }
    .phone {
      width: 390px;
      max-width: 100%;
      background: var(--bg);
      border-radius: 18px;
      padding: 12px;
      margin: 0 auto 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
    }
    .cover {
      aspect-ratio: 16 / 9;
      position: relative;
    }
    .info {
      padding: 7px 8px 8px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title-row {
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .title {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.25;
      color: var(--title);
    }
    .meta { font-size: 11px; color: var(--meta); }
    .chip {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--chip);
      border: 1px solid var(--line);
      color: #fff;
      display: grid;
      place-items: center;
      letter-spacing: 1px;
      font-size: 16px;
      line-height: 1;
    }
    .old-dot {
      position: absolute;
      top: 4px;
      right: 2px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: rgba(255,255,255,0.7);
      font-size: 18px;
    }
    .section { margin-bottom: 8px; color: #9a9a9a; font-size: 12px; }
  </style>
</head>
<body>
  <div class="page">
    <h1>更多按钮放在标题行，不盖封面</h1>
    <p class="lead">浅色、高饱和、近黑封面都不再决定按钮能不能看见。按钮落在卡片深灰信息区，和标题同一行、顶对齐。</p>

    <div class="section">现在（封面右上，48px 热区把 18px 图标推到封面中部）</div>
    <div class="phone">
      <div class="grid">
        <article class="card">
          <div class="cover" style="background:#f2ead8;"><span class="old-dot">⋮</span></div>
          <div class="info"><div class="title">浅色封面</div><div class="meta">24:10</div></div>
        </article>
        <article class="card">
          <div class="cover" style="background:#1a1a1a;"><span class="old-dot">⋮</span></div>
          <div class="info"><div class="title">近黑封面</div><div class="meta">08:02</div></div>
        </article>
        <article class="card">
          <div class="cover" style="background:#e23d28;"><span class="old-dot">⋮</span></div>
          <div class="info"><div class="title">高饱和封面</div><div class="meta">41:55</div></div>
        </article>
        <article class="card">
          <div class="cover" style="background:#3d7cff;"><span class="old-dot">⋮</span></div>
          <div class="info"><div class="title">蓝色封面</div><div class="meta">12:00</div></div>
        </article>
      </div>
    </div>

    <div class="section">调整后（信息区芯片，封面完整）</div>
    <div class="phone" id="after">
      <div class="grid">
        <article class="card">
          <div class="cover" style="background:#f2ead8;"></div>
          <div class="info">
            <div class="title-row"><div class="title">浅色封面也不会吞掉按钮</div><button class="chip" type="button" aria-label="更多">···</button></div>
            <div class="meta">24:10</div>
          </div>
        </article>
        <article class="card">
          <div class="cover" style="background:#1a1a1a;"></div>
          <div class="info">
            <div class="title-row"><div class="title">近黑封面同样清楚</div><button class="chip" type="button" aria-label="更多">···</button></div>
            <div class="meta">08:02</div>
          </div>
        </article>
        <article class="card">
          <div class="cover" style="background:#e23d28;"></div>
          <div class="info">
            <div class="title-row"><div class="title">高饱和封面</div><button class="chip" type="button" aria-label="更多">···</button></div>
            <div class="meta">41:55</div>
          </div>
        </article>
        <article class="card">
          <div class="cover" style="background:#3d7cff;"></div>
          <div class="info">
            <div class="title-row"><div class="title">蓝色封面</div><button class="chip" type="button" aria-label="更多">···</button></div>
            <div class="meta">12:00</div>
          </div>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
